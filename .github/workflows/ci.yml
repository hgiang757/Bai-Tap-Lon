name: CI

on: [push, pull_request]

jobs:
  test:
    name: Client tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B test
        working-directory: auction-client-ui

  server-test:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: auction-server/pom.xml
      - run: mvn -B verify
        working-directory: auction-server

  integration:
    name: Full stack and JavaFX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libasound2t64
      - run: xvfb-run -a mvn -B verify -Dauction.ui.tests=true
      - run: python scripts/check-encoding.py && python scripts/check-docs.py && python scripts/check-contrast.py
        working-directory: auction-client-ui
