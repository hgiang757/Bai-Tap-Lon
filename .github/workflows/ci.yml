name: CI
on: [push, pull_request]
jobs:
  verify:
    name: Java, Socket and JavaFX tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libasound2t64
      - run: xvfb-run -a mvn -B verify -Dauction.ui.tests=true
      - name: Upload test and quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-quality-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/checkstyle-result.xml
          if-no-files-found: warn
